ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

server {
    listen       443 ssl;
    server_name  xdd44.xyz  www.xdd44.xyz;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    keepalive_timeout   70;
    ssl_certificate /etc/letsencrypt/live/xdd44.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xdd44.xyz/privkey.pem; # managed by Certbot

    if ($request_uri ~ "^/(?:html(?:/index(?:\.html)?)?/?|index(?:\.html)?)(?:\?.*)?$") {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ "^/html(/[^?]*)(?:\?.*)?$") {
        return 301 $1$is_args$args;
    }
    if ($request_uri ~ "^(/[^?]*)/index\.html(?:\?.*)?$") {
        return 301 $1/$is_args$args;
    }
    if ($request_uri ~ "^(/[^?]*)\.html(?:\?.*)?$") {
        return 301 $1$is_args$args;
    }

    root /home/xdd44_utopia/Portfolio/dist;

    location ~* \.(?:css|js|map|jpe?g|gif|png|ttf|mp4|webm)$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }
    }

    include /etc/nginx/apps/*.locations;

    location / {
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404 {
        try_files /404.html =404;
    }

    error_page 404 /404;

}

server {
    if ($host = xdd44.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen       80;
    server_name  xdd44.xyz  www.xdd44.xyz;
    return 404; # managed by Certbot


}
